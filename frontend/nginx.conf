server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA talks to the API cross-origin, so nothing here needs a large body.
    client_max_body_size 1m;

    # Hashed asset filenames are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or users get a stale bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Client-side routing: unknown paths fall through to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx version in the Server header tells a scanner exactly what to try.
    server_tokens off;
}
